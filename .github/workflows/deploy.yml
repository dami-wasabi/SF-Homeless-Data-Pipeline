# Manual deployment. Run from the Actions tab ("Run workflow") once the
# OIDC role and secrets below exist. Authentication uses GitHub OIDC, so no
# long-lived AWS keys are stored in the repository.
#
# One-time setup (outside CI):
#   cd infra && npx cdk bootstrap aws://<ACCOUNT_ID>/<REGION>
#   Create an IAM role trusting token.actions.githubusercontent.com for this repo.
#
# Required secrets
#   AWS_ROLE_ARN        IAM role assumed via OIDC
#   AWS_REGION          e.g. us-east-1
#   ALERT_EMAIL         address subscribed to the CloudWatch alarm topic
#   PARTNER_BUCKET      partner S3 bucket polled nightly
#   PARTNER_KEY         partner CSV key in that bucket
#   VITE_API_URL        API Gateway URL (CDK output ApiEndpoint)
#   FRONTEND_BUCKET     S3 bucket for the dashboard (CDK output FrontendBucketName)
#   CLOUDFRONT_DIST_ID  CloudFront distribution ID
name: Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  infra:
    name: Deploy infrastructure (CDK)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: npm ci
        working-directory: infra
      - name: cdk diff
        run: npx cdk diff
        working-directory: infra
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PARTNER_BUCKET: ${{ secrets.PARTNER_BUCKET }}
          PARTNER_KEY: ${{ secrets.PARTNER_KEY }}
      - name: cdk deploy
        run: npx cdk deploy --require-approval never
        working-directory: infra
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          PARTNER_BUCKET: ${{ secrets.PARTNER_BUCKET }}
          PARTNER_KEY: ${{ secrets.PARTNER_KEY }}

  frontend:
    name: Deploy dashboard (S3 + CloudFront)
    runs-on: ubuntu-latest
    needs: infra
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: npm ci
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
      - name: Upload to S3
        run: |
          # Hashed assets can be cached forever; index.html must always be revalidated.
          aws s3 sync dashboard/build/ "s3://${{ secrets.FRONTEND_BUCKET }}/" \
            --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp dashboard/build/index.html "s3://${{ secrets.FRONTEND_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DIST_ID }}" --paths "/index.html"
